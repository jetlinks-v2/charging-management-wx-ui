server {
 listen 80;
 location = /finance-h5/config.json { alias /usr/share/nginx/html/finance-h5/config.json; add_header Cache-Control "no-store" always; }
 location /finance-h5/assets/ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=31536000, immutable"; }
 location /finance-h5/ { root /usr/share/nginx/html; try_files $uri $uri/ /finance-h5/index.html; add_header Cache-Control "no-cache"; }
 location /api/ { proxy_pass http://jetlinks-all-in-one-api-gateway-service:8800/; proxy_set_header Host $host; }
}
